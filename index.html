<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0f">
    
    <title>Jogos Caseiros</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0f; /* Fundo minimalista escuro */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 20px 20px 20px;
            overflow-x: hidden;
        }

        /* Telas */
        .screen {
            display: none; /* Escondidas por padrão */
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex; /* Mostra apenas a tela ativa */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-size: 1.8rem;
            color: #ececec;
        }

        h2 {
            font-weight: 400;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #b0b0b0;
        }

        /* Grade Minimalista para 5 jogos */
        .games-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 40px;
        }

        @media (min-width: 400px) {
            .games-container {
                grid-template-columns: 1fr 1fr;
            }
            /* Faz o último botão (Paredão) ocupar a linha inteira para centralizar */
            .games-container a:last-child:nth-child(odd) {
                grid-column: span 2;
            }
        }

        /* Estilo dos Botões - Minimalista */
        .btn {
            background-color: transparent;
            color: #ececec;
            text-decoration: none;
            padding: 16px 10px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            font-weight: 400;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .btn-donation-link {
            border: 1px dashed #555;
            color: #888;
            font-size: 0.9rem;
            padding: 12px;
            max-width: 250px;
        }

        .btn-donation-link:hover {
            border-style: solid;
        }

        .btn-back {
            margin-top: 30px;
            border-color: #555;
            color: #888;
        }

        /* Seção do QR Code */
        .qr-wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .qr-code {
            width: 200px;
            height: 200px;
            display: block;
        }

        /* Notificação */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            border-radius: 30px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* Assinatura */
        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #ffffff;
            opacity: 0.15; /* Bem discreto */
        }
    </style>
</head>
<body>

    <!-- TELA 1: JOGOS -->
    <div id="screen-home" class="screen active">
        <h1>Jogos Caseiros</h1>

        <div class="games-container">
            <a href="https://wgrmoreira.github.io/setas_metafofos/" class="btn" target="_blank">Jogo das Setas</a>
            <a href="https://wgrmoreira.github.io/RPG-Pocket/" class="btn" target="_blank">RPG Pocket</a>
            <a href="https://wgrmoreira.github.io/RPGPOCKET2/" class="btn" target="_blank">RPG Pocket 2</a>
            <a href="https://wgrmoreira.github.io/XadrezMagnetico/" class="btn" target="_blank">Xadrez Magnético</a>
            <!-- Novo jogo adicionado -->
            <a href="https://wgrmoreira.github.io/Paredao/" class="btn" target="_blank">Paredão</a>
        </div>

        <button class="btn btn-donation-link" onclick="switchScreen('screen-donation')">☕ Apoiar Projetos</button>
    </div>


    <!-- TELA 2: DOAÇÃO -->
    <div id="screen-donation" class="screen">
        <h2>Apoie meus projetos</h2>
        
        <div class="qr-wrapper">
            <img id="qr-img" alt="QR Code PIX" class="qr-code">
        </div>
        
        <button class="btn" onclick="copiarPix()">Copiar Chave PIX</button>
        <button class="btn btn-back" onclick="switchScreen('screen-home')">Voltar aos Jogos</button>
    </div>

    <!-- Mensagem flutuante -->
    <div id="toast">Chave PIX copiada!</div>

    <!-- Assinatura discreta -->
    <footer>wgrmoreira</footer>

    <script>
        // Função para ativar Tela Cheia no primeiro clique/toque do usuário na tela
        function activateFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Fullscreen automático bloqueado ou indisponível: ${err.message}`);
                });
            }
        }
        // Ouve o primeiro clique na página inteira e aciona a tela cheia invisivelmente
        document.body.addEventListener('click', activateFullscreen, { once: true });
        document.body.addEventListener('touchstart', activateFullscreen, { once: true });

        // Função para alternar entre as telas de Jogos e Doação
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Configuração do PIX (Payload válido)
        const pixPayloadValido = "00020126330014br.gov.bcb.pix0111044311047635204000053039865802BR5911WGR MOREIRA6006BRASIL62070503***63046C23"; 

        // Gera o QR Code
        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(pixPayloadValido)}`;

        // Função de copiar PIX
        function copiarPix() {
            navigator.clipboard.writeText(pixPayloadValido).then(() => {
                mostrarNotificacao();
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                alert("Erro ao copiar a chave PIX.");
            });
        }

        // Animação de notificação (Toast)
        function mostrarNotificacao() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
