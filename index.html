<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Tags para permitir que a página funcione em Tela Cheia como um Web App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <title>Jogos Caseiros</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px 10px 20px; /* Mais espaço no topo para o botão fullscreen */
            position: relative;
        }

        /* Botão de Tela Cheia */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background-color: #d13d56;
        }

        h1 {
            margin-bottom: 30px;
            color: #e94560;
            text-align: center;
        }

        /* Novo layout: Grade (Grid) para acomodar os 4 botões perfeitamente */
        .games-container {
            display: grid;
            grid-template-columns: 1fr; /* 1 coluna em telas muito pequenas */
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 50px;
        }

        /* Em telas um pouco maiores (acima de 400px), organiza em 2 colunas */
        @media (min-width: 400px) {
            .games-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .game-btn {
            background-color: #16213e;
            color: #fff;
            text-decoration: none;
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 1.05rem;
            text-align: center;
            font-weight: 600;
            border: 2px solid #0f3460;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .game-btn:hover {
            background-color: #0f3460;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .donation-section {
            background-color: #16213e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e94560;
            max-width: 350px;
            width: 100%;
        }

        .donation-section h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            background-color: #fff;
            border-radius: 8px;
            margin: 0 auto 20px auto;
            object-fit: contain;
            padding: 10px;
            display: block;
        }

        .copy-btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .copy-btn:hover {
            background-color: #d13d56;
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #4CAF50;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.75rem;
            color: #ffffff;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- Botão para forçar a tela cheia no navegador -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>

    <h1>Jogos Caseiros</h1>

    <div class="games-container">
        <a href="https://wgrmoreira.github.io/setas_metafofos/" class="game-btn" target="_blank">Jogo das Setas</a>
        <a href="https://wgrmoreira.github.io/RPG-Pocket/" class="game-btn" target="_blank">RPG Pocket</a>
        <a href="https://wgrmoreira.github.io/RPGPOCKET2/" class="game-btn" target="_blank">RPG Pocket 2</a>
        <!-- Novo Jogo Adicionado -->
        <a href="https://wgrmoreira.github.io/XadrezMagnetico/" class="game-btn" target="_blank">Xadrez Magnético</a>
    </div>

    <div class="donation-section">
        <h2>Apoie meus projetos</h2>
        
        <img id="qr-img" alt="QR Code para Doação PIX" class="qr-code">
        
        <button class="copy-btn" onclick="copiarPix()">Copiar PIX Copia e Cola</button>
    </div>

    <div id="toast">Código PIX copiado com sucesso!</div>

    <footer>by wgrmoreira</footer>

    <script>
        // Função para ativar/desativar Tela Cheia
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Erro ao tentar ativar tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Código do PIX
        const pixPayloadValido = "00020126330014br.gov.bcb.pix0111044311047635204000053039865802BR5911WGR MOREIRA6006BRASIL62070503***63046C23"; 

        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(pixPayloadValido)}`;

        function copiarPix() {
            navigator.clipboard.writeText(pixPayloadValido).then(() => {
                mostrarNotificacao();
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                alert("Erro ao copiar a chave. Tente novamente.");
            });
        }

        function mostrarNotificacao() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }
    </script>
</body>
</html>
